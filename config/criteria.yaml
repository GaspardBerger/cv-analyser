versie: "2.0"
context:
  doelgroep: "Jongeren op zoek naar werk in Brussel (Belgische/Europese markt)"
  taal_hint: "CV kan in NL, FR of EN zijn — analyseer in de taal van het CV maar geef analyse in het Nederlands"
  markt: "Belgische arbeidsmarkt, Brusselse regio"
  bron: "Gebaseerd op de papieren CV-checklist (lay-out + inhoud) die leerlingen eerst manueel doorlopen; wie alles van de checklist in orde heeft, behaalt 100/100"

# handmatig: true = niet betrouwbaar te beoordelen via tekstextractie (visueel aspect).
# De AI geeft dan het voordeel van de twijfel (score 1) tenzij de tekst duidelijk
# het tegendeel bewijst, en vermeldt dat dit zelf visueel nagekeken moet worden.

categorieen:
  lay_out:
    naam: "Lay-out"
    gewicht: 45
    criteria:
      - id: lengte_1_pagina
        beschrijving: "Lengte: alles staat op 1 pagina (gebruik de technische gegevens indien beschikbaar)"
        verplicht: true
        gewicht: 1
      - id: leesbaar
        beschrijving: "Goed leesbaar: de tekst is groot genoeg, minimum 11pt (gebruik de technische gegevens indien beschikbaar)"
        verplicht: true
        gewicht: 1
      - id: kort_bondig
        beschrijving: "Kort en bondig: geen volledige zinnen (uitzondering: taken bij werkervaring en het profiel)"
        verplicht: true
        gewicht: 1
      - id: duidelijke_titels
        beschrijving: "Overzichtelijk: het is duidelijk wat de titels van de secties zijn"
        verplicht: true
        gewicht: 1
      - id: sectie_volgorde
        beschrijving: "Logische volgorde van de secties: Contactinfo – Profiel – Werkervaring – Studies – Talen – Computerkennis – Extra info"
        verplicht: true
        gewicht: 1
      - id: recent_bovenaan
        beschrijving: "Logische volgorde: het meest recente staat bovenaan bij werkervaring en studies"
        verplicht: true
        gewicht: 1
      - id: aantrekkelijk
        beschrijving: "Aantrekkelijk: het CV is mooi om naar te kijken"
        verplicht: false
        gewicht: 1
        handmatig: true
      - id: geen_schrijffouten
        beschrijving: "Zonder fouten: geen schrijffouten (spelling en grammatica)"
        verplicht: true
        gewicht: 1
      - id: hoofdletters
        beschrijving: "Zonder fouten: alle namen, plaatsen… beginnen met een hoofdletter"
        verplicht: true
        gewicht: 1
      - id: consistent_lettertype
        beschrijving: "Consequent lettertype: alles heeft hetzelfde lettertype en dezelfde grootte, uitzondering: titels (gebruik de technische gegevens indien beschikbaar)"
        verplicht: true
        gewicht: 1
      - id: uitlijning
        beschrijving: "Uitlijning: alles staat netjes onder elkaar"
        verplicht: false
        gewicht: 1
        handmatig: true
      - id: geen_dubbele_spaties
        beschrijving: "Verzorgd: nergens te veel spaties (dubbele spaties)"
        verplicht: true
        gewicht: 1
      - id: gepaste_foto
        beschrijving: "Gepaste foto (enkel verplicht bij een functie met klantencontact)"
        verplicht: false
        gewicht: 1
        handmatig: true

  inhoud:
    naam: "Inhoud"
    gewicht: 55
    criteria:
      - id: contact_naam
        beschrijving: "Contactinfo: Voornaam FAMILIENAAM aanwezig"
        verplicht: true
        gewicht: 1
      - id: contact_adres
        beschrijving: "Contactinfo: adres aanwezig en in dezelfde taal als het CV (voor een Nederlandstalig CV in het Nederlands, bv. 'Wetstraat', niet 'Rue de la Loi')"
        verplicht: true
        gewicht: 1
      - id: contact_email
        beschrijving: "Contactinfo: professioneel e-mailadres (vb. mohammed.diallo@gmail.com — geen bijnamen, geboortejaren of willekeurige cijfers)"
        verplicht: true
        gewicht: 1
      - id: contact_telefoon
        beschrijving: "Contactinfo: telefoonnummer in leesbaar formaat (vb. 0471 23 45 67)"
        verplicht: true
        gewicht: 1
      - id: profiel
        beschrijving: "Profiel: de werkgever leest in een paar zinnen meteen het belangrijkste"
        verplicht: true
        gewicht: 1
      - id: werkervaring_volledig
        beschrijving: "Werkervaring: elke ervaring vermeldt periode, functie/job, naam bedrijf en locatie van het bedrijf (enkel gemeente); heeft de deelnemer nog geen werkervaring, dan telt dit als in orde"
        verplicht: true
        gewicht: 1
      - id: werkervaring_taken
        beschrijving: "Werkervaring: taken beschreven met actieve werkwoorden; zonder werkervaring telt dit als in orde"
        verplicht: true
        gewicht: 1
      - id: studies_volledig
        beschrijving: "Studies en opleidingen: huidige studie vermeld met schooljaar, studierichting, naam school en locatie van de school (enkel gemeente)"
        verplicht: true
        gewicht: 1
      - id: studies_andere
        beschrijving: "Studies en opleidingen: andere relevante studies/opleidingen vermeld en duidelijk of een diploma/attest behaald werd; zijn er geen andere opleidingen, dan telt dit als in orde"
        verplicht: false
        gewicht: 1
      - id: talen_volgorde
        beschrijving: "Taalvaardigheden: juiste volgorde — Nederlands, Frans, Engels en daarna andere talen"
        verplicht: true
        gewicht: 1
      - id: talen_niveau
        beschrijving: "Taalvaardigheden: niveau vermeld per taal (bv. basiskennis, goed, moedertaal of A1–C2)"
        verplicht: true
        gewicht: 1
      - id: computer
        beschrijving: "Computervaardigheden: vermeld mét niveau"
        verplicht: true
        gewicht: 1
      - id: extra_kwaliteiten
        beschrijving: "Extra info: kwaliteiten vermeld"
        verplicht: true
        gewicht: 1
      - id: extra_hobbys
        beschrijving: "Extra info: relevante hobby's en interesses vermeld"
        verplicht: true
        gewicht: 1
      - id: extra_beschikbaarheid
        beschrijving: "Extra info: beschikbaarheid vermeld"
        verplicht: true
        gewicht: 1
      - id: extra_geboortedatum
        beschrijving: "Extra info: geboortedatum vermeld"
        verplicht: true
        gewicht: 1
